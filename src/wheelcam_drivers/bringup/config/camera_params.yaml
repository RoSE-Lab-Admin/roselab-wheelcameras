/**: # The name of your usb_cam node
  ros__parameters:
    # Standard usb_cam settings
    image_width: 1280
    image_height: 720
    framerate: 60.0
    pixel_format: mjpeg2rgb

    white_balance_temperature_auto: false
    exposure_auto: 0
    focus_auto: false
    
    image_raw:
      compressed:
        format: "jpeg"
        jpeg_quality: 50