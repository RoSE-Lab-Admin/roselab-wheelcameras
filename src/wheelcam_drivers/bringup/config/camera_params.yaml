/**: # The name of your usb_cam node
  ros__parameters:
    # Standard usb_cam settings
    image_width: 1280
    image_height: 720
    framerate: 60.0
    pixel_format: raw_mjpeg

    #v4l2 exposed commands
    auto_exposure: 1
    exposure_time_absolute: 500
    exposure_dynamic_framerate: 1
    focus_auto: false
    
    image_raw:
      compressed:
        format: "jpeg"
        jpeg_quality: 95